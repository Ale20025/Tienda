<head>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Press+Start+2P&family=Syne+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <button id="Back"></button>
    
    <div id="Premio"></div>

    <button id="Clave"></button>
    <div id="Numero"></div>

    <div id="Exito">
        <h3>✨Compra con exito✨</h3>
    </div>

    <div id="NoExito">
        <h3>AlePuntos Insuficientes</h3>
    </div>

    <div id="Mensaje">
        <div id="Puntos">
            <h5 id="Alepuntos">25000 Alepuntos</h5>
        </div>
        <div id="Datos">
            <img id="Imagen" src="imagenes/roca.png" alt="Imagen">
            <div id="NombrePrecio">
                <p class="Texto" id="Nombre">Producto: Roca mascota</p>
                <p class="Texto" id="Precio">Precio: 500$</p>
            </div>
        </div>
        <p class="Texto" id="Descripcion">Descripcion:Boba</p>
        <div id="Botones">
            <button id="Cancelar">Cancelar</button>
            <button id="Comprar">Comprar</button>
        </div>
    </div>
    <div id="Dibujo"></div>
    <div id="Aviso">
        <h1>Esta es la tienda. No encontre manera de entregar tu compra anonima, asi que si quieres tu entrega, manda una captura, solo eso es necesario.</h1>
    </div>
    <div id="Estante">
        <div class="Filas" id="Fila1">
            <button class="Boton" id="Producto1" data-id="0"></button>
            <button class="Boton" id="Producto2" data-id="1"></button>
            <button class="Boton" id="Producto3" data-id="2"></button>
        </div>
        <div class="Filas" id="Fila2">
            <button class="Boton" id="Producto4" data-id="3"></button>
            <button class="Boton" id="Producto5" data-id="4"></button>
            <button class="Boton" id="Producto6" data-id="5"></button>
        </div>
        <div class="Filas" id="Fila3">
            <button class="Boton" id="Producto7" data-id="6"></button>
            <button class="Boton" id="Producto8" data-id="7"></button>
            <button class="Boton" id="Producto9" data-id="8"></button>
        </div>
        <div class="Filas" id="Fila4">
            <button class="Boton" id="Producto10" data-id="9"></button>
            <button class="Boton" id="Producto11" data-id="10"></button>
            <button class="Boton" id="Producto12" data-id="11"></button>
        </div>
        <div class="Filas" id="Fila5">
            <button class="Boton" id="Producto13" data-id="12"></button>
            <button class="Boton" id="Producto14" data-id="13"></button>
            <button class="Boton" id="Producto15" data-id="14"></button>
        </div>
    </div>

    <button id="Sonido"></button>

    <audio id="Musica" loop>
        <source src="audio/tienda.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido1">
        <source src="audio/producto.aac" type="audio/aac">
    </audio>

    <audio id="Sonido2">
        <source src="audio/comprar.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido3">
        <source src="audio/premio.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido4">
        <source src="audio/nonono.mp4" type="audio/mp4">
    </audio>

    <audio id="Sonido5">
        <source src="audio/casino.mp4" type="audio/mp4">
    </audio>

    <button id="Casino"></button>

    <script src="script.js"></script>
</body>
